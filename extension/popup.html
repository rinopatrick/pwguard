<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 320px; padding: 16px; background: #0f172a; color: #e2e8f0; font-family: system-ui, sans-serif; }
    h1 { font-size: 16px; font-weight: 700; margin-bottom: 12px; background: linear-gradient(135deg, #818cf8, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    input { width: 100%; padding: 10px 12px; background: #1e293b; border: 1px solid #334155; border-radius: 8px; color: white; font-size: 14px; outline: none; }
    input:focus { border-color: #6366f1; }
    .result { margin-top: 12px; }
    .bar { height: 6px; background: #1e293b; border-radius: 3px; overflow: hidden; }
    .bar-fill { height: 100%; width: 0%; border-radius: 3px; transition: width 0.3s, background-color 0.3s; }
    .stats { display: flex; justify-content: space-between; margin-top: 8px; font-size: 11px; color: #94a3b8; }
    .label { font-size: 13px; font-weight: 600; margin-top: 6px; }
    .info { font-size: 10px; color: #64748b; margin-top: 12px; text-align: center; }
  </style>
</head>
<body>
  <h1>🛡️ PWGuard</h1>
  <input type="password" id="pw" placeholder="Type a password to check...">
  <div class="result">
    <div class="bar"><div class="bar-fill" id="bar"></div></div>
    <div class="label" id="label"></div>
    <div class="stats">
      <span id="entropy"></span>
      <span id="crack"></span>
      <span id="zxcvbn"></span>
    </div>
  </div>
  <div class="info">Passwords are sent to your local PWGuard server only.</div>
  <script>
    var API_URL = 'http://localhost:8001';
    var pw = document.getElementById('pw');
    var bar = document.getElementById('bar');
    var label = document.getElementById('label');
    var entropy = document.getElementById('entropy');
    var crack = document.getElementById('crack');
    var zxcvbn = document.getElementById('zxcvbn');
    var debounce = null;

    function getColor(pct) {
      if (pct < 25) return '#ef4444';
      if (pct < 50) return '#f97316';
      if (pct < 75) return '#eab308';
      return '#10b981';
    }

    pw.addEventListener('input', function() {
      clearTimeout(debounce);
      if (!pw.value) { bar.style.width = '0%'; label.textContent = ''; entropy.textContent = ''; crack.textContent = ''; zxcvbn.textContent = ''; return; }
      debounce = setTimeout(function() {
        fetch(API_URL + '/api/analyze', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pw.value }),
        })
        .then(function(r) { return r.json(); })
        .then(function(d) {
          var c = getColor(d.strength_percent);
          bar.style.width = d.strength_percent + '%';
          bar.style.backgroundColor = c;
          label.textContent = d.strength_label + ' (' + d.strength_percent + '%)';
          label.style.color = c;
          entropy.textContent = d.entropy + ' bits';
          crack.textContent = d.crack_time_display;
          zxcvbn.textContent = 'zxcvbn: ' + d.zxcvbn_score + '/4';
        })
        .catch(function() { label.textContent = 'Server unavailable'; });
      }, 300);
    });
  </script>
</body>
</html>
